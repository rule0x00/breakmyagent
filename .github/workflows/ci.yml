name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      # Same host ports as docker-compose, so the tests' default URLs work unchanged.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bma
          POSTGRES_PASSWORD: bma
          POSTGRES_DB: breakmyagent
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U bma" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Small, cheap sample of both eval suites against the real model. Skipped when no key is configured
  # (e.g. on forks); run the full suites locally.
  evals-sample:
    needs: agent
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Defense evals (sample)
        if: env.ANTHROPIC_API_KEY != ''
        run: python evals/run_defense_evals.py --sample 6 --levels 1,3,5
      - name: Classifier evals (sample)
        if: env.ANTHROPIC_API_KEY != ''
        run: python evals/run_classifier_evals.py --sample 15
      - name: No API key configured
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY secret not set; skipping eval sample."
