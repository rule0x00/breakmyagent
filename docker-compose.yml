services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bma}
      POSTGRES_DB: ${POSTGRES_DB:-breakmyagent}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bma}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build: ./agent
    env_file: .env
    ports:
      - "${AGENT_HOST_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    env_file: .env
    ports:
      - "${API_HOST_PORT:-3100}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy

  web:
    build: ./web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3100}
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  pgdata:
